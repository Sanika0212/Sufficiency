<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Sufficiency: know when retrieved context is enough to answer, fix it cheaply when it is not, and abstain with a guaranteed error rate">
  <rect width="1200" height="260" rx="18" fill="#fcfcfb"/>
  <text x="56" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#0b0b0b">Sufficiency</text>
  <text x="58" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#52514e">Is the retrieved context enough to answer?</text>
  <text x="58" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#52514e">Know it, fix it cheaply, or abstain.</text>
  <rect x="600" y="123" width="530" height="14" rx="7" fill="#e1e0d9"/><rect x="600" y="123" width="201.4" height="14" rx="7" fill="#eb6834" fill-opacity="0.85"/><rect x="801.4" y="123" width="143.10000000000002" height="14" fill="#2a78d6" fill-opacity="0.35"/><rect x="944.5" y="123" width="185.5" height="14" rx="7" fill="#1baf7a" fill-opacity="0.9"/><line x1="944.5" y1="100" x2="944.5" y2="160" stroke="#0b0b0b" stroke-width="2" stroke-dasharray="5 4"/><text x="944.5" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#52514e">guaranteed threshold</text><circle cx="700.7" cy="178" r="6" fill="#eb6834"/><text x="712.7" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0b0b0b">abstain</text><circle cx="872.95" cy="178" r="6" fill="#2a78d6"/><text x="884.95" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0b0b0b">fix the context</text><circle cx="1037.25" cy="178" r="6" fill="#1baf7a"/><text x="1049.25" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#0b0b0b">answer</text><text x="600" y="222" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#52514e">P(the retrieved passages are enough)  0 → 1</text>
</svg>
