<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Sufficiency: know when retrieved context is enough to answer, fix it cheaply when it is not, and abstain with a guaranteed error rate">
  <rect width="1200" height="260" rx="18" fill="#1a1a19"/>
  <text x="56" y="118" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="700" fill="#ffffff">Sufficiency</text>
  <text x="58" y="162" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">Is the retrieved context enough to answer?</text>
  <text x="58" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#c3c2b7">Know it, fix it cheaply, or abstain.</text>
  <rect x="600" y="123" width="530" height="14" rx="7" fill="#2c2c2a"/><rect x="600" y="123" width="201.4" height="14" rx="7" fill="#d95926" fill-opacity="0.85"/><rect x="801.4" y="123" width="143.10000000000002" height="14" fill="#3987e5" fill-opacity="0.35"/><rect x="944.5" y="123" width="185.5" height="14" rx="7" fill="#199e70" fill-opacity="0.9"/><line x1="944.5" y1="100" x2="944.5" y2="160" stroke="#ffffff" stroke-width="2" stroke-dasharray="5 4"/><text x="944.5" y="90" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" text-anchor="middle" fill="#c3c2b7">guaranteed threshold</text><circle cx="700.7" cy="178" r="6" fill="#d95926"/><text x="712.7" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff">abstain</text><circle cx="872.95" cy="178" r="6" fill="#3987e5"/><text x="884.95" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff">fix the context</text><circle cx="1037.25" cy="178" r="6" fill="#199e70"/><text x="1049.25" y="183" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="#ffffff">answer</text><text x="600" y="222" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#c3c2b7">P(the retrieved passages are enough)  0 → 1</text>
</svg>
