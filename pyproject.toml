[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sufficiency"
version = "0.1.0"
description = "Know when retrieved context is enough to answer, fix it cheaply when it isn't, and abstain with a guaranteed error rate"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sanika Najan", email = "sanikanajan@gmail.com" }]
requires-python = ">=3.11"
keywords = ["rag", "retrieval", "abstention", "selective-prediction", "conformal-prediction", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.5", "httpx>=0.27"]

[project.optional-dependencies]
models = ["torch>=2.4", "transformers>=4.45", "sentencepiece>=0.2", "protobuf>=4.25"]
bench = ["pandas>=2.2", "pyarrow>=17"]
viz = ["matplotlib>=3.9", "pillow>=10.4"]

[project.scripts]
sufficiency = "sufficiency.cli:main"

[project.urls]
Homepage = "https://github.com/Sanika0212/Sufficiency"
Issues = "https://github.com/Sanika0212/Sufficiency/issues"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.112", "ruff>=0.7", "mypy>=1.13", "pre-commit>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sufficiency"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
# SIM905: word lists read better as one split string than as many quoted items.
ignore = ["RUF001", "RUF002", "RUF003", "SIM905"]

[tool.ruff.lint.per-file-ignores]
# SVG templates are clearer as long lines
"scripts/make_figures.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/sufficiency"]

[[tool.mypy.overrides]]
module = ["torch.*", "transformers.*", "matplotlib.*", "pandas.*", "pyarrow.*", "sklearn.*", "joblib.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.coverage.run]
source = ["sufficiency"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
